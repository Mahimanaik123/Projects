<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6dd5fa, #2980b9);
        }

        .container{
            width: 450px;
            padding: 85px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2{
            margin-bottom: 20px;
            font-size: 22px;
            color: #333;
        }

        .box{
            margin-bottom: 35px;
            text-align: left;
        }

        label{
            font-size: 14px;
            color: #555;
        }

        input{
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
            margin-top: 5px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 12px;
            background: #2980b9;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover{
            background: #1f6692;
        }

        .result{
            margin-top: 15px;
            font-size: 18px;
            color: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Temperature Converter</h2>

        <div class="box">
            <label>Enter Temperature (°C):</label>
            <input type="number" id="celsius" placeholder="Enter value in Celsius">
        </div>

        <button onclick="convertTemp()">Convert</button>

        <p class="result" id="result"></p>
    </div>

    <script>
        function convertTemp(){
            let c = document.getElementById("celsius").value;

            if(c === ""){
                document.getElementById("result").innerHTML = "Please enter a value!";
                return;
            }

            let f = (c * 9/5) + 32;
            let k = parseFloat(c) + 273.15;

            document.getElementById("result").innerHTML =
                `Fahrenheit: ${f.toFixed(2)} °F <br> Kelvin: ${k.toFixed(2)} K`;
        }
    </script>

</body>
</html>
